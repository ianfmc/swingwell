<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWINGWELL Diary</title>
  <link rel="stylesheet" href="assets/swingwell.css">
</head>
<body class="swingwell-app diary-app">
  <header>
    <div><p class="eyebrow">Canonical archive</p><h1>SWINGWELL Diary</h1><p>Read, search and filter your practice and round diaries.</p></div>
  </header>
  <main>
    <nav class="diary-nav" aria-label="Diary navigation"><a href="index.html#performance">Back to Performance</a><a href="diary.html">All diary entries</a></nav>
    <div>
      <section id="archive">
        <div class="section-heading"><div><p class="eyebrow">Session log</p><h2>Diary entries</h2></div><span class="count" id="entry-count">Loading…</span></div>
        <div class="toolbar">
          <input aria-label="Search diaries" id="search" type="search" placeholder="Search date, location, or session…">
          <select aria-label="Filter by session type" id="type-filter"><option value="">All session types</option></select>
          <select aria-label="Filter by mental state" id="state-filter"><option value="">All mental states</option><option>GREEN</option><option>YELLOW</option><option>RED</option></select>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>Date</th><th>Type</th><th>Location</th><th>State</th></tr></thead><tbody id="diary-body"></tbody></table>
        </div>
      </section>
      <section id="diary-reader" hidden aria-labelledby="entry-title">
        <div class="section-heading"><div><p class="eyebrow">From the diary</p><h2 id="entry-title">Diary entry</h2></div><a id="markdown-source" class="text-link" hidden>Markdown source</a></div>
        <p id="entry-meta" class="helper"></p>
        <p id="reader-status" role="status">Loading diary…</p>
        <article id="diary-content" class="diary-prose" aria-label="Diary content"></article>
        <p><a class="archive-link" href="diary.html">Back to all diary entries</a></p>
      </section>
    </div>
  </main>
  <script src="assets/vendor/marked.umd.js" defer></script>
  <script src="assets/diary.js" defer></script>
</body>
</html>
